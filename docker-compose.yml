version: '3.8'

services:

  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: triton_server
    command: ["tritonserver", "--model-repository=/models"]
    volumes:
      - ./triton/model_repository:/models
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    shm_size: '1gb'
    # Uncomment deploy section if using NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USER:-seai}/backend:latest
    container_name: fastapi_backend
    ports:
      - "8081:8080"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-mock-key-for-testing}
      - TRITON_URL=triton:8001
    depends_on:
      - triton

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USER:-seai}/frontend:latest
    container_name: react_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8081
    depends_on:
      - backend
